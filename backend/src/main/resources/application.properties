# Serve the contract file itself (src/main/resources/openapi/berlin-clock.yaml) next to the default static locations
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,classpath:/openapi/

# Swagger UI renders that file, so the documentation is the contract the code is generated from.
# Do not set springdoc.api-docs.enabled=false here: it also switches off the Swagger UI (404).
springdoc.swagger-ui.url=/berlin-clock.yaml
